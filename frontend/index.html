<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Grader Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Auto Grader</h1>
        <form id="grader-form">
            <label for="image">Upload Answer Image:</label>
            <input type="file" id="image" name="image" accept="image/*" required><br>

            <label for="criteria">Assessment Criteria:</label>
            <input type="text" id="criteria" name="criteria" placeholder="e.g. Correctness, Steps, Neatness" required><br>

            <label for="mode">Checking Mode:</label>
            <select id="mode" name="mode">
                <option value="lenient">Lenient</option>
                <option value="normal" selected>Normal</option>
                <option value="strict">Strict</option>
            </select><br>

            <label for="max_marks">Maximum Marks:</label>
            <input type="number" id="max_marks" name="max_marks" value="4" min="1" required><br>

            <button type="button" id="assess-btn">Assess</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
